<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100b08">
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=2">
  <link rel="icon" type="image/png" sizes="512x512" href="icon.png?v=2">
  <title>衛生管理者3分クイズ v0</title>
  <style>
    :root {
      --bg: #080706;
      --panel: #17110d;
      --panel-soft: #211712;
      --gold: #f5c762;
      --ember: #ff7b30;
      --text: #f8efe2;
      --muted: #c9bba4;
      --line: rgba(245, 199, 98, 0.26);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans",
        "Yu Gothic", "YuGothic", "Noto Sans JP", sans-serif;
      line-height: 1.7;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 123, 48, 0.22), transparent 30%),
        radial-gradient(circle at 18% 68%, rgba(245, 199, 98, 0.1), transparent 26%),
        linear-gradient(180deg, #100b08 0%, #080706 52%, #040403 100%);
      -webkit-tap-highlight-color: transparent;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      background-size: 26px 26px;
      opacity: 0.38;
    }

    .quiz-app {
      position: relative;
      width: min(100%, 560px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 20px 16px 28px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 8px 12px;
      color: var(--gold);
      font-size: 14px;
      font-weight: 850;
      text-decoration: none;
      background: rgba(245, 199, 98, 0.06);
      border: 1px solid rgba(245, 199, 98, 0.22);
      border-radius: 8px;
    }

    header {
      padding: 28px 0 22px;
      text-align: center;
    }

    .ember-mark {
      width: 58px;
      height: 58px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 62%, #ffd978 0 11%, #ff8a34 25%, #91350d 48%, #24100a 72%);
      box-shadow:
        0 0 24px rgba(255, 123, 48, 0.42),
        0 0 54px rgba(245, 199, 98, 0.2);
      animation: emberBreath 3.4s ease-in-out infinite;
    }

    @keyframes emberBreath {
      0%, 100% {
        transform: scale(0.96);
      }

      50% {
        transform: scale(1.04);
      }
    }

    h1 {
      margin: 0;
      color: var(--gold);
      font-size: clamp(25px, 7vw, 36px);
      font-weight: 900;
      line-height: 1.3;
      text-shadow: 0 0 18px rgba(245, 199, 98, 0.22);
    }

    .tagline {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
      font-weight: 800;
    }

    .quiz-card {
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(255, 123, 48, 0.08), transparent 42%),
        rgba(23, 17, 13, 0.94);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.42);
    }

    .description {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
    }

    .sample-note {
      margin: 8px 0 18px;
      color: var(--muted);
      font-size: 13px;
    }

    button {
      border: 0;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    .primary-button {
      width: 100%;
      min-height: 56px;
      padding: 12px 16px;
      color: #1b1008;
      font-size: 17px;
      font-weight: 900;
      background: linear-gradient(180deg, #ffe28c, #f3aa35);
      box-shadow:
        0 10px 22px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.42);
    }

    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .progress-label {
      color: var(--gold);
      font-size: 14px;
      font-weight: 900;
    }

    .progress-note {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .progress-track {
      height: 8px;
      overflow: hidden;
      background: #080605;
      border: 1px solid rgba(245, 199, 98, 0.12);
      border-radius: 999px;
    }

    .progress-fill {
      width: 20%;
      height: 100%;
      background: linear-gradient(90deg, var(--ember), #ffcf68);
      border-radius: inherit;
      transition: width 220ms ease;
    }

    .question {
      min-height: 112px;
      margin: 22px 0;
      font-size: 20px;
      font-weight: 850;
      line-height: 1.7;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .answer-button {
      min-height: 70px;
      color: var(--text);
      font-size: 28px;
      font-weight: 950;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent),
        #231710;
      border: 1px solid var(--line);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
    }

    .answer-button:disabled {
      cursor: default;
      opacity: 1;
    }

    .answer-button.is-correct {
      color: #f4ffe8;
      background: #375121;
      border-color: rgba(181, 226, 113, 0.7);
    }

    .answer-button.is-wrong {
      color: #fff1e9;
      background: #6b291c;
      border-color: rgba(255, 144, 104, 0.72);
    }

    .feedback {
      margin-top: 16px;
      padding: 14px;
      background: rgba(245, 199, 98, 0.07);
      border-left: 4px solid var(--gold);
      border-radius: 8px;
    }

    .feedback.is-correct {
      border-left-color: #a9d86e;
    }

    .feedback.is-wrong {
      border-left-color: #ff8257;
    }

    .feedback-title {
      display: block;
      color: var(--gold);
      font-size: 17px;
      font-weight: 900;
    }

    .feedback-text {
      margin: 5px 0 0;
      font-size: 14px;
    }

    .next-button {
      margin-top: 14px;
    }

    .result-label {
      margin: 0;
      color: var(--gold);
      font-size: 14px;
      font-weight: 900;
    }

    .score {
      margin: 5px 0 18px;
      font-size: clamp(30px, 9vw, 42px);
      font-weight: 950;
      line-height: 1.35;
    }

    .review {
      margin-bottom: 16px;
      padding: 14px;
      background: var(--panel-soft);
      border: 1px solid rgba(245, 199, 98, 0.18);
      border-radius: 8px;
    }

    .review-title {
      margin: 0 0 10px;
      color: var(--gold);
      font-size: 16px;
      font-weight: 900;
    }

    .review-list {
      margin: 0;
      padding-left: 22px;
      font-size: 14px;
    }

    .review-list li + li {
      margin-top: 14px;
    }

    .review-list p {
      margin: 0;
      font-weight: 800;
    }

    .review-list small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      line-height: 1.6;
    }

    .review-empty {
      color: var(--muted);
      list-style: none;
      transform: translateX(-22px);
    }

    .bottom-back-link {
      display: grid;
      place-items: center;
      min-height: 50px;
      margin-top: 18px;
      color: var(--gold);
      font-size: 15px;
      font-weight: 850;
      text-decoration: none;
      background: rgba(245, 199, 98, 0.06);
      border: 1px solid rgba(245, 199, 98, 0.22);
      border-radius: 8px;
    }

    .primary-button:active,
    .answer-button:active,
    .back-link:active,
    .bottom-back-link:active {
      transform: translateY(1px);
    }

    [hidden] {
      display: none;
    }

    @media (max-width: 370px) {
      .quiz-app {
        padding-right: 12px;
        padding-left: 12px;
      }

      .quiz-card {
        padding: 16px;
      }

      .question {
        min-height: 126px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="quiz-app">
    <a class="back-link" href="index.html">火種ユイに戻る</a>

    <header>
      <div class="ember-mark" aria-hidden="true"></div>
      <h1>衛生管理者3分クイズ v0</h1>
      <p class="tagline">今日は5問だけ。間違いは火種になる。</p>
    </header>

    <section class="quiz-card" aria-label="衛生管理者クイズ">
      <div id="startView">
        <p class="description">〇 / ×で答える、1回5問のミニクイズです。</p>
        <p class="sample-note">現在は動作確認用の仮問題です。正式な教材ベースの内容へ後で差し替えます。</p>
        <button class="primary-button" type="button" id="startButton">クイズを始める</button>
      </div>

      <div id="questionView" hidden>
        <div class="progress-row">
          <span class="progress-label" id="progressLabel">問題 1 / 5</span>
          <span class="progress-note">直感で、ひとつずつ。</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <p class="question" id="questionText" aria-live="polite"></p>

        <div class="answers">
          <button class="answer-button" type="button" data-answer="true" aria-label="まる">〇</button>
          <button class="answer-button" type="button" data-answer="false" aria-label="ばつ">×</button>
        </div>

        <div class="feedback" id="feedback" aria-live="polite" hidden>
          <strong class="feedback-title" id="feedbackTitle"></strong>
          <p class="feedback-text" id="feedbackText"></p>
        </div>

        <button class="primary-button next-button" type="button" id="nextButton" hidden>次の問題</button>
      </div>

      <div id="resultView" aria-live="polite" hidden>
        <p class="result-label">今回の結果</p>
        <p class="score" id="scoreText"></p>

        <div class="review">
          <h2 class="review-title">復習リスト：間違えた問題</h2>
          <ol class="review-list" id="reviewList"></ol>
        </div>

        <button class="primary-button" type="button" id="retryButton">もう一度挑戦</button>
      </div>
    </section>

    <a class="bottom-back-link" href="index.html">火種ユイに戻る</a>
  </main>

  <script>
    // 動作確認用の仮問題です。正式な教材ベースの内容へ後で差し替えます。
    var quizQuestions = [
      {
        question: "衛生管理者は、職場の安全衛生を支える役割を持つ。",
        answer: true,
        explanation: "衛生管理者は、労働者の健康障害防止や衛生管理に関わる役割を担います。"
      },
      {
        question: "労働衛生では、作業環境・作業方法・健康管理の視点が重要になる。",
        answer: true,
        explanation: "労働衛生では、環境・作業・健康の3つの視点で考えると理解しやすくなります。"
      },
      {
        question: "疲労や睡眠不足は、作業中の集中力や判断力に影響しない。",
        answer: false,
        explanation: "疲労や睡眠不足は、集中力や判断力の低下につながる可能性があります。"
      },
      {
        question: "職場の衛生管理では、病気になってから対応すれば十分である。",
        answer: false,
        explanation: "衛生管理では、病気や健康障害を未然に防ぐ予防の視点が重要です。"
      },
      {
        question: "換気・温度・照明などの作業環境は、働きやすさや健康に関係する。",
        answer: true,
        explanation: "作業環境は、労働者の健康や作業効率に影響するため、衛生管理上の重要な要素です。"
      }
    ];

    var quizRound = [];
    var currentQuestionIndex = 0;
    var correctCount = 0;
    var mistakes = [];
    var answered = false;

    var startView = document.getElementById("startView");
    var questionView = document.getElementById("questionView");
    var resultView = document.getElementById("resultView");
    var startButton = document.getElementById("startButton");
    var retryButton = document.getElementById("retryButton");
    var nextButton = document.getElementById("nextButton");
    var progressLabel = document.getElementById("progressLabel");
    var progressFill = document.getElementById("progressFill");
    var questionText = document.getElementById("questionText");
    var answerButtons = document.querySelectorAll(".answer-button");
    var feedback = document.getElementById("feedback");
    var feedbackTitle = document.getElementById("feedbackTitle");
    var feedbackText = document.getElementById("feedbackText");
    var scoreText = document.getElementById("scoreText");
    var reviewList = document.getElementById("reviewList");

    function makeQuizRound() {
      var questions = quizQuestions.slice();

      for (var i = questions.length - 1; i > 0; i--) {
        var randomIndex = Math.floor(Math.random() * (i + 1));
        var temporaryQuestion = questions[i];
        questions[i] = questions[randomIndex];
        questions[randomIndex] = temporaryQuestion;
      }

      return questions.slice(0, 5);
    }

    function formatAnswer(answer) {
      return answer ? "〇" : "×";
    }

    function renderQuestion() {
      var question = quizRound[currentQuestionIndex];

      answered = false;
      progressLabel.textContent =
        "問題 " + (currentQuestionIndex + 1) + " / " + quizRound.length;
      progressFill.style.width =
        ((currentQuestionIndex + 1) / quizRound.length * 100) + "%";
      questionText.textContent = question.question;
      feedback.hidden = true;
      feedback.className = "feedback";
      nextButton.hidden = true;

      for (var i = 0; i < answerButtons.length; i++) {
        answerButtons[i].disabled = false;
        answerButtons[i].classList.remove("is-correct", "is-wrong");
      }
    }

    function startQuiz() {
      quizRound = makeQuizRound();
      currentQuestionIndex = 0;
      correctCount = 0;
      mistakes = [];
      startView.hidden = true;
      resultView.hidden = true;
      questionView.hidden = false;
      renderQuestion();
    }

    function answerQuestion(selectedAnswer) {
      if (answered) {
        return;
      }

      answered = true;
      var question = quizRound[currentQuestionIndex];
      var isCorrect = selectedAnswer === question.answer;

      if (isCorrect) {
        correctCount += 1;
      } else {
        mistakes.push(question);
      }

      for (var i = 0; i < answerButtons.length; i++) {
        var buttonAnswer = answerButtons[i].getAttribute("data-answer") === "true";
        answerButtons[i].disabled = true;

        if (buttonAnswer === question.answer) {
          answerButtons[i].classList.add("is-correct");
        } else if (buttonAnswer === selectedAnswer) {
          answerButtons[i].classList.add("is-wrong");
        }
      }

      feedbackTitle.textContent = isCorrect ? "正解" : "不正解";
      feedbackText.textContent = question.explanation;
      feedback.classList.add(isCorrect ? "is-correct" : "is-wrong");
      feedback.hidden = false;
      nextButton.textContent =
        currentQuestionIndex === quizRound.length - 1 ? "結果を見る" : "次の問題";
      nextButton.hidden = false;
    }

    function showResult() {
      questionView.hidden = true;
      resultView.hidden = false;
      scoreText.textContent = quizRound.length + "問中" + correctCount + "問正解";
      reviewList.replaceChildren();

      if (mistakes.length === 0) {
        var emptyMessage = document.createElement("li");
        emptyMessage.className = "review-empty";
        emptyMessage.textContent = "間違えた問題はありません。全問正解です。";
        reviewList.appendChild(emptyMessage);
        return;
      }

      for (var i = 0; i < mistakes.length; i++) {
        var mistake = mistakes[i];
        var item = document.createElement("li");
        var mistakeQuestion = document.createElement("p");
        var mistakeExplanation = document.createElement("small");

        mistakeQuestion.textContent = mistake.question;
        mistakeExplanation.textContent =
          "正解：" + formatAnswer(mistake.answer) + "　" + mistake.explanation;
        item.appendChild(mistakeQuestion);
        item.appendChild(mistakeExplanation);
        reviewList.appendChild(item);
      }
    }

    startButton.addEventListener("click", startQuiz);
    retryButton.addEventListener("click", startQuiz);

    for (var i = 0; i < answerButtons.length; i++) {
      answerButtons[i].addEventListener("click", function () {
        answerQuestion(this.getAttribute("data-answer") === "true");
      });
    }

    nextButton.addEventListener("click", function () {
      currentQuestionIndex += 1;

      if (currentQuestionIndex < quizRound.length) {
        renderQuestion();
      } else {
        showResult();
      }
    });
  </script>
</body>
</html>
